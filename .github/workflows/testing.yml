name: Testing and validation

on: [push, pull_request]

jobs:
  test:
    name: Tests
    strategy:
      matrix:
        node: [ 22 ]
    runs-on: ubuntu-latest

    steps:
    - name: Check-out
      uses: actions/checkout@v4
    - name: Set up Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test
